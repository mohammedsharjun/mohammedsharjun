<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc"><title id="title">Mohammed Sharjun — Application Developer</title><desc id="desc">Mobile and web application developer. Flutter, React Native, React, Next.js, Firebase and Supabase. Available for freelance projects.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080e20"/><stop offset=".55" stop-color="#11162e"/><stop offset="1" stop-color="#071b25"/></linearGradient><radialGradient id="blueGlow"><stop stop-color="#437bff" stop-opacity=".24"/><stop offset="1" stop-color="#437bff" stop-opacity="0"/></radialGradient><radialGradient id="tealGlow"><stop stop-color="#39d7ca" stop-opacity=".13"/><stop offset="1" stop-color="#39d7ca" stop-opacity="0"/></radialGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#d4e6ff" stop-opacity=".08"/><stop offset="1" stop-color="#809bc7" stop-opacity=".025"/></linearGradient><linearGradient id="edge" x2="1" y2="1"><stop stop-color="#b4d2ff" stop-opacity=".32"/><stop offset=".5" stop-color="#94baff" stop-opacity=".08"/><stop offset="1" stop-color="#6cd9d0" stop-opacity=".2"/></linearGradient><clipPath id="outer"><rect width="1100" height="820" rx="24"/></clipPath><clipPath id="nameClip" clipPathUnits="userSpaceOnUse"><rect class="reveal" width="420" height="60"/></clipPath></defs><style>text{font-family:monospace;fill:#edf4ff;font-size:17px}.label{font-size:14px;fill:#78dbd4;letter-spacing:.5px}.muted{fill:#afbed6;font-size:16px}@keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes move{from{transform:translateX(0)}to{transform:translateX(420px)}}@keyframes blink{50%{opacity:0}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{50%{opacity:.4}}.reveal{transform-origin:0 0;animation:type 2.1s steps(15,end) .3s both}.cursor{transform:translateX(420px);animation:move 2.1s steps(15,end) .3s both}.blink{animation:blink 1s step-end infinite}.intro{animation:fade .7s ease 2.5s both}.details{animation:fade .7s ease 2.8s both}.pulse{animation:pulse 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.reveal,.cursor,.blink,.intro,.details,.pulse{animation:none}}</style><g clip-path="url(#outer)"><rect width="1100" height="820" fill="url(#bg)"/><ellipse cx="220" cy="170" rx="540" ry="400" fill="url(#blueGlow)"/><ellipse cx="1040" cy="650" rx="520" ry="480" fill="url(#tealGlow)"/></g><rect x="20" y="20" width="1060" height="780" rx="18" fill="#071020" fill-opacity=".52"/><rect x="20" y="20" width="1060" height="780" rx="18" fill="url(#glass)" stroke="url(#edge)"/><path d="M21 78H1079" stroke="#c1d5ff" stroke-opacity=".12"/><circle cx="49" cy="49" r="5" fill="#ff8585"/><circle cx="69" cy="49" r="5" fill="#f4ce7b"/><circle cx="89" cy="49" r="5" fill="#73d8ac"/><text x="125" y="54" class="muted">sharjun / profile</text><text x="54" y="124" class="label">APPLICATION DEVELOPER · MOBILE &amp; WEB</text><g transform="translate(54 145)"><g clip-path="url(#nameClip)"><text x="0" y="43" textLength="420" lengthAdjust="spacingAndGlyphs" style="font-size:43px;font-weight:700">MOHAMMED SHARJUN</text></g><g class="cursor"><rect y="6" width="3" height="43" fill="#8abaff" class="blink"/></g></g><g class="intro"><text x="54" y="233" style="font-size:22px;fill:#91beff">Thoughtful interfaces. Reliable applications.</text><text x="54" y="271" class="muted">I build mobile and web applications with intuitive interfaces</text><text x="54" y="297" class="muted">and integrated backend services.</text></g><g class="details"><path d="M54 324H1046M650 360V496" stroke="#c1d5ff" stroke-opacity=".12"/><text x="54" y="365" class="label">01 / DEVELOPMENT</text><text x="690" y="365" class="label">02 / APPROACH</text><text x="54" y="410" class="muted">MOBILE</text><text x="280" y="410">Flutter / React Native</text><text x="54" y="450" class="muted">WEB</text><text x="280" y="450">React / Next.js</text><text x="54" y="490" class="muted">BACKEND</text><text x="280" y="490">Firebase / Supabase</text><text x="690" y="410">Understand the requirements.</text><text x="690" y="450">Build the core experience.</text><text x="690" y="490">Test, refine, and deliver.</text><rect x="54" y="532" width="992" height="154" rx="14" fill="#07101e" fill-opacity=".5"/><rect x="54" y="532" width="992" height="154" rx="14" fill="url(#glass)" stroke="url(#edge)"/><text x="78" y="564" class="label">03 / CURRENT PROJECT</text><text x="78" y="603" style="font-size:24px;font-weight:700">Mobile Learning Application</text><text x="78" y="635" class="muted">Interactive lessons, quizzes, audio content, and saved progress.</text><text x="78" y="663" style="font-size:14px;fill:#91beff">IN DEVELOPMENT</text><circle cx="60" cy="722" r="5" fill="#78dbd4" class="pulse"/><text x="78" y="728">Available for freelance mobile and web development.</text><text x="54" y="768" class="muted">github.com/mohammedsharjun</text></g></svg>