<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Mohammed Sharjun — Mobile and Web Developer</title><desc id="desc">From interface to implementation. Flutter, React Native, React, Next.js, Firebase and Supabase. Mobile learning application in development. Available for freelance projects.</desc><defs><radialGradient id="glow" cx="1" cy="0" r="1"><stop stop-color="#388bfd" stop-opacity=".22"/><stop offset="1" stop-color="#388bfd" stop-opacity="0"/></radialGradient><clipPath id="hero"><rect x="16" y="16" width="928" height="240" rx="20"/></clipPath><clipPath id="name"><rect class="reveal" width="390" height="52"/></clipPath><g id="phone"><rect x="4" y="1" width="14" height="22" rx="3"/><path d="M9 19h4"/></g><g id="web"><rect x="1" y="3" width="22" height="17" rx="3"/><path d="M1 8h22m-15 16h8m-4-4v4"/></g><g id="db"><ellipse cx="12" cy="5" rx="10" ry="4"/><path d="M2 5v14c0 5 20 5 20 0V5M2 12c0 5 20 5 20 0"/></g><g id="book"><path d="M12 5C8 2 4 2 1 3v17c4-1 7-1 11 2 4-3 7-3 11-2V3c-3-1-7-1-11 2v17"/></g></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f0f6fc}.label{font-size:12px;letter-spacing:1.8px;font-weight:700;fill:#8ebdff}.muted{font-size:16px;fill:#abb8ca}.icon{fill:none;stroke:#79b8ff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}@keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes move{from{transform:translateX(0)}to{transform:translateX(390px)}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes fade{from{opacity:0}to{opacity:1}}.reveal{transform-origin:0 0;animation:type 1.8s steps(15,end) .2s both}.cursor{transform:translateX(390px);animation:move 1.8s steps(15,end) .2s both}.blink{opacity:0;animation:blink .7s step-end 5}.intro{animation:fade .6s ease 2.1s both}.cards{animation:fade .6s ease 2.3s both}@media(prefers-reduced-motion:reduce){.reveal,.cursor,.blink,.intro,.cards{animation:none}.blink{opacity:0}}</style><rect width="960" height="620" fill="#0d1117"/><rect x="16" y="16" width="928" height="240" rx="20" fill="#151b23" stroke="#30363d"/><g clip-path="url(#hero)"><rect x="16" y="16" width="928" height="240" fill="url(#glow)"/></g><text x="44" y="54" class="label">MOBILE &amp; WEB DEVELOPER</text><g transform="translate(44 72)"><g clip-path="url(#name)"><text y="39" font-family="monospace" style="font-family:monospace" font-size="40" font-weight="700" textLength="390" lengthAdjust="spacingAndGlyphs">MOHAMMED SHARJUN</text></g><g class="cursor"><rect y="3" width="2" height="42" fill="#79b8ff" class="blink"/></g></g><g class="intro"><text x="44" y="158" font-size="26" font-weight="600">From interface to implementation.</text><text x="44" y="195" class="muted">I build mobile and web applications, connecting thoughtful interfaces</text><text x="44" y="220" class="muted">with the data and services behind them.</text></g><g class="cards"><rect x="16" y="272" width="440" height="250" rx="20" fill="#161b22" stroke="#30363d"/><rect x="472" y="272" width="472" height="250" rx="20" fill="#161b22" stroke="#30363d"/><text x="44" y="309" class="label">DEVELOPMENT STACK</text><g class="icon"><use href="#phone" x="44" y="336"/><use href="#web" x="44" y="396"/><use href="#db" x="44" y="456"/><use href="#book" x="500" y="290"/></g><text x="84" y="345" font-size="13" fill="#abb8ca" style="fill:#abb8ca">MOBILE</text><text x="84" y="369" font-size="18" font-weight="600">Flutter · React Native</text><text x="84" y="405" font-size="13" style="fill:#abb8ca">WEB</text><text x="84" y="429" font-size="18" font-weight="600">React · Next.js</text><text x="84" y="465" font-size="13" style="fill:#abb8ca">BACKEND</text><text x="84" y="489" font-size="18" font-weight="600">Firebase · Supabase</text><text x="536" y="309" class="label">CURRENTLY BUILDING</text><text x="500" y="356" font-size="25" font-weight="700">Mobile Learning Application</text><text x="500" y="390" class="muted">Lessons, interactive quizzes, and audio,</text><text x="500" y="415" class="muted">with saved progress across activities.</text><rect x="500" y="451" width="143" height="30" rx="15" fill="#1b2a40" stroke="#334d70"/><circle cx="516" cy="466" r="3" fill="#79b8ff"/><text x="528" y="471" font-size="13" style="fill:#a6ccff">In development</text><rect x="16" y="538" width="928" height="66" rx="18" fill="#161b22" stroke="#30363d"/><circle cx="46" cy="571" r="4" fill="#7ee2b8"/><text x="62" y="577" font-size="16">Available for freelance mobile and web development.</text><text x="916" y="577" text-anchor="end" font-size="13" style="fill:#abb8ca">github.com/mohammedsharjun</text></g></svg>